<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Leaderboard — Informed Crusader</title>
<meta name="description" content="Warhammer 40k competitive player rankings by ELO rating: view top players across solo and team events with win rates and performance trends.">
<meta property="og:title" content="Player Leaderboard — Informed Crusader">
<meta property="og:description" content="Competitive player rankings from BCP and New Recruit events.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header>
  <a class="site-logo" href="index.html">Informed Crusader</a>
  <span class="subtitle" id="window-label"></span>
  <span class="spacer"></span>
  <a class="nav-link" href="index.html">Factions</a>
  <a class="nav-link active" href="players.html">Players</a>
  <a class="nav-link" href="tournaments.html">Tournaments</a>
  <a class="nav-link" href="dispositions.html">Dispositions</a>
  <a class="nav-link" href="legend.html">About</a>
  <span class="meta-info" id="build-info"></span>
</header>

<main>
  <div class="controls">
    <input class="search-input" type="search" id="search" placeholder="Search player…" autocomplete="off">
    <div class="btn-group" id="event-type-btns" role="group" aria-label="Event type filter">
      <button class="btn active" data-val="all">All Events</button>
      <button class="btn" data-val="solo">Singles</button>
      <button class="btn" data-val="team">Teams</button>
    </div>
    <span id="row-count" style="color:var(--dim);font-size:0.8rem;margin-left:4px;"></span>
  </div>

  <div class="panel">
    <div class="panel-title">Player Leaderboard <span class="panel-note">(min 3 games)</span></div>
    <div class="table-wrap">
      <table id="players-table">
        <thead>
          <tr>
            <th title="Rank by ELO rating">Rank</th>
            <th>Player</th>
            <th title="Current ELO rating">Rating</th>
            <th title="Peak ELO rating achieved">Peak</th>
            <th title="Games played in the window">Games</th>
            <th title="Win rate in the window (draw = 0.5 win)">Win %</th>
            <th title="Factions played in the window">Factions</th>
            <th title="Rating change over the window">Trend</th>
            <th title="Total lifetime games across all events">Total</th>
            <th title="K-factor (40=new, 32=standard, 24=experienced)">K</th>
            <th title="Consistency score 0-1 (higher = more stable)">Cons.</th>
            <th title="Win rate vs higher-rated opponents">Upset %</th>
          </tr>
        </thead>
        <tbody id="players-tbody">
          <tr><td colspan="12" class="loading">Loading data…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/app.js" defer></script>
<script src="assets/players.js" defer></script>
<script data-goatcounter="https://informedcrusader.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
