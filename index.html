<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCPTrawler — Warhammer 40k Meta Explorer</title>
<meta name="description" content="Warhammer 40k tournament meta analysis: faction win rates, play rates, detachment breakdown, top players, and matchup data from BCP and New Recruit events.">
<meta property="og:title" content="BCPTrawler — Warhammer 40k Meta Explorer">
<meta property="og:description" content="Competitive meta data from BCP and New Recruit events: win rates, play rates, detachments, matchups.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" defer></script>
</head>
<body>

<header>
  <a class="site-logo" href="index.html">BCPTrawler</a>
  <span class="subtitle" id="window-label"></span>
  <span class="spacer"></span>
  <a class="nav-link" href="legend.html">About</a>
  <a class="nav-link" href="https://r0ot2u.github.io/FactionCards/cards.html" id="cards-link" target="_blank" rel="noopener">PNG Cards ↗</a>
  <span class="meta-info" id="build-info"></span>
</header>

<main>
  <div class="controls">
    <input class="search-input" type="search" id="search" placeholder="Search faction…" autocomplete="off">
    <div class="btn-group" id="event-type-btns" role="group" aria-label="Event type filter">
      <button class="btn active" data-val="all">All Events</button>
      <button class="btn" data-val="solo">Singles</button>
      <button class="btn" data-val="team">Teams</button>
    </div>
    <div class="btn-group" id="sort-btns" role="group" aria-label="Sort order">
      <button class="btn active" data-sort="play_rate">Play Rate</button>
      <button class="btn" data-sort="win_rate">Win Rate</button>
      <button class="btn" data-sort="faction">A–Z</button>
    </div>
    <span id="row-count" style="color:var(--dim);font-size:0.8rem;margin-left:4px;"></span>
  </div>

  <div class="panel">
    <div class="panel-title">Faction Performance</div>
    <div class="table-wrap">
      <table id="faction-table">
        <thead>
          <tr>
            <th>Faction</th>
            <th title="Number of lists playing this faction in the window">Lists</th>
            <th title="Share of all lists in the window playing this faction">Play %</th>
            <th title="Win rate across all games in the window (draw = 0.5 win)">Win %</th>
            <th title="Win-rate change compared to the previous window of the same length">Trend</th>
            <th title="The detachment with the most lists for this faction">Top Detachment</th>
          </tr>
        </thead>
        <tbody id="faction-tbody">
          <tr><td colspan="6" class="loading">Loading data…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="chart-section" class="two-col" style="margin-top:8px;">
    <div class="chart-wrap">
      <div class="panel-title">Play Rate %</div>
      <div id="chart-play" style="height:520px;"></div>
    </div>
    <div class="chart-wrap">
      <div class="panel-title">Win Rate %</div>
      <div id="chart-wr" style="height:520px;"></div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/app.js" defer></script>
<script src="assets/index.js" defer></script>
</body>
</html>
